
<div id="ebou-loader" class="ebou-loader" aria-label="Chargement de EBOU" role="status">
  <div class="ebou-loader__content">
    <img
      class="ebou-loader__logo"
      src="/assets/app-icon.jpeg"
      alt="EBOU"
    />

    <p class="ebou-loader__brand">EBOU</p>
    <p class="ebou-loader__message">Retrouvons ce qui compte.</p>

    <div
      class="ebou-loader__track"
      role="progressbar"
      aria-label="Progression du chargement"
      aria-valuemin="0"
      aria-valuemax="100"
    >
      <span class="ebou-loader__progress"></span>
    </div>
  </div>
</div>
